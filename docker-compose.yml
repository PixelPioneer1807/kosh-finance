# Local development database. Production uses a managed Postgres (Neon) — see docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:17-alpine
    container_name: kosh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosh
      POSTGRES_PASSWORD: kosh
      POSTGRES_DB: kosh
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - kosh-pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosh"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  kosh-pgdata:
